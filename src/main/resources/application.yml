spring:
  application:
    name: distributed-task-scheduler

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taskdb}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:scheduler}
    password: ${SPRING_DATASOURCE_PASSWORD:scheduler}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Fixed typo from 'flayway' to 'flyway'
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true
    consumer:
      group-id: task-scheduler-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.scheduler.dto,com.scheduler.model

server:
  port: 8080

kafka:
  topics:
    task-submissions: task-submissions
    task-events: task-events
    task-dlq: task-dlq

scheduler:
  worker-count: 4
  queue-capacity: 100
  heartbeat-interval-ms: 5000
  heartbeat-timeout-ms: 15000
  max-retries: 3
  base-retry-delay-ms: 1000
  poll-interval-ms: 2000
  hash-ring:
    virtual-nodes: 150
  circuit-breaker:
    failure-threshold: 5
    reset-timeout-ms: 30000
    window-ms: 60000
  failure-rates:
    data-processing: 15
    multi-csv-processing: 20
  task-timeout-ms: 60000
  stuck-check-interval-ms: 5000
  rate-limit:
    enabled: true
    global-capacity: 10
    global-refill-per-sec: 2
    per-type-capacity: 5
    per-type-refill-per-sec: 1
  starvation-boost-interval-ms: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: distributed-task-scheduler
  
logging:
  level:
    org.springframework.kafka: WARN
    com.scheduler: INFO

data:
  redis:
    host: ${REDIS_HOST:localhost}
    port: 6379
    timeout: 2000ms

cache:
  type: redis
  redis:
    time-to-live: 600000ms
    cache-null-values: false
    